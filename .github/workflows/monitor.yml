name: Melbet Monitor

on:
  repository_dispatch:
    types: [run-monitor]
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: melbet-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python monitor.py

      - name: Commit updated alerts state
        run: |
          git config user.name "melbet-monitor-bot"
          git config user.email "actions@github.com"

          git add alerts.json

          if git diff --cached --quiet; then
            echo "No alert state changes to commit."
          else
            git commit -m "Update alerts state"
            git push
          fi
